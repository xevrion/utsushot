name: Feature request
description: Suggest something utsushot should do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Proposing support for a new compositor? Use the "New backend" template
        instead, which asks the questions specific to that work.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you are in, not only the feature you want.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What should utsushot do? Include the command line you imagine typing.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, and why they fall short.

  - type: checkboxes
    id: participation
    attributes:
      label: Participation
      options:
        - label: I would be willing to implement this
